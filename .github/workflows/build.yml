name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # web/index.html -> app/src/main/assets/index.html (локальные шрифты, отступы под системные панели)
      - name: Prepare web assets
        run: python3 tools/make_assets.py

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # Свой ключ подписи, если он добавлен в секреты репозитория (иначе app/debug.keystore)
      - name: Restore release key
        env:
          KS: ${{ secrets.QN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "QN_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          QN_STORE_PASSWORD: ${{ secrets.QN_STORE_PASSWORD }}
          QN_KEY_PASSWORD: ${{ secrets.QN_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/QuestNotes-0.2.${GITHUB_RUN_NUMBER}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: QuestNotes-apk
          path: out/*.apk

      # Тег вида v0.2.0 публикует APK в разделе Releases — оттуда его удобно скачать прямо на телефон
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
