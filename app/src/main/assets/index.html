<style>
/* Layout: одна колонка-приложение до 760px; липкая строка «поиск + Заметки|РПГ», заметки сеткой Keep с группами-чипами, РПГ с нижней панелью вкладок; гача — полноэкранная сцена в собственной тёмной гамме */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --surface-2:#E7ECE5; --ink:#1B201C; --muted:#59645B; --line:#D3DAD1;
  --accent:#2E6A4E; --accent-ink:#FFFFFF; --accent-soft:#DCEBE2;
  --gold:#9A620E; --gold-ink:#FFFFFF; --xp:#3F63C8; --danger:#B3412F; --hp:#C2453A; --mag:#7A4FC4;
  --n-c1:#F7EBC6; --n-c2:#DCEBD4; --n-c3:#D5E5F2; --n-c4:#F4DCDA; --n-c5:#E4DDF3;
  --de:#3E8E5E; --dm:#3F63C8; --dh:#B5651D; --dp:#9B3FB8;
  --shadow:0 1px 2px rgba(20,30,22,.06),0 4px 14px rgba(20,30,22,.06);
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-pixel:"Press Start 2P",ui-monospace,"Courier New",monospace;
  --r3:#4E9BDB; --r4:#9A62E0; --r5:#E0A22E; --r6:#FF6FA8;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101311; --surface:#191E1A; --surface-2:#232A25; --ink:#E4EAE3; --muted:#97A399; --line:#2E3630;
  --accent:#7DC49F; --accent-ink:#0E1A13; --accent-soft:#1F3328;
  --gold:#E3B04E; --gold-ink:#1A1205; --xp:#8FA9F2; --danger:#E5806E; --hp:#E86A5C; --mag:#B697F0;
  --n-c1:#3A3320; --n-c2:#22342A; --n-c3:#1E2E3A; --n-c4:#3A2526; --n-c5:#2D2740;
  --de:#79CC98; --dm:#8FA9F2; --dh:#E6A35E; --dp:#D38BEA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101311; --surface:#191E1A; --surface-2:#232A25; --ink:#E4EAE3; --muted:#97A399; --line:#2E3630;
  --accent:#7DC49F; --accent-ink:#0E1A13; --accent-soft:#1F3328;
  --gold:#E3B04E; --gold-ink:#1A1205; --xp:#8FA9F2; --danger:#E5806E; --hp:#E86A5C; --mag:#B697F0;
  --n-c1:#3A3320; --n-c2:#22342A; --n-c3:#1E2E3A; --n-c4:#3A2526; --n-c5:#2D2740;
  --de:#79CC98; --dm:#8FA9F2; --dh:#E6A35E; --dp:#D38BEA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}

/* темы, открываемые прокачкой */
body[data-th="light"]{--bg:#F3F5F1;--surface:#FFFFFF;--surface-2:#E7ECE5;--ink:#1B201C;--muted:#59645B;--line:#D3DAD1;--accent:#2E6A4E;--accent-ink:#FFFFFF;--accent-soft:#DCEBE2;--gold:#9A620E;--gold-ink:#FFFFFF;--xp:#3F63C8;--danger:#B3412F;--hp:#C2453A;--mag:#7A4FC4;--n-c1:#F7EBC6;--n-c2:#DCEBD4;--n-c3:#D5E5F2;--n-c4:#F4DCDA;--n-c5:#E4DDF3;--shadow:0 1px 2px rgba(20,30,22,.06),0 4px 14px rgba(20,30,22,.06);color-scheme:light}
body[data-th="forest"]{--bg:#EEF2E6;--surface:#FAFCF5;--surface-2:#E0E8D4;--ink:#1E2A1B;--muted:#56684F;--line:#CBD6BE;--accent:#3D7A2E;--accent-ink:#FFFFFF;--accent-soft:#D6E8CB;--gold:#8E6410;--gold-ink:#FFFFFF;--xp:#2F7A68;--danger:#B3412F;--hp:#C2453A;--mag:#6E4FA8;--n-c1:#F1E6BE;--n-c2:#D2E6C5;--n-c3:#CFE3DE;--n-c4:#EED9C8;--n-c5:#DCE3C2;--shadow:0 1px 2px rgba(30,42,27,.07),0 4px 14px rgba(30,42,27,.07);color-scheme:light}
body[data-th="sunset"]{--bg:#FBF1E9;--surface:#FFFBF7;--surface-2:#F3E3D7;--ink:#2B1D18;--muted:#7A5F55;--line:#EAD5C6;--accent:#C2503A;--accent-ink:#FFFFFF;--accent-soft:#F6DCD2;--gold:#A0640C;--gold-ink:#FFFFFF;--xp:#8A4FB0;--danger:#B3412F;--hp:#C2453A;--mag:#8A4FB0;--n-c1:#FBE7BF;--n-c2:#F6D7C3;--n-c3:#F3D0D6;--n-c4:#E7D3EC;--n-c5:#D9E2EE;--shadow:0 1px 2px rgba(43,29,24,.07),0 4px 14px rgba(43,29,24,.07);color-scheme:light}
body[data-th="dark"]{--bg:#101311;--surface:#191E1A;--surface-2:#232A25;--ink:#E4EAE3;--muted:#97A399;--line:#2E3630;--accent:#7DC49F;--accent-ink:#0E1A13;--accent-soft:#1F3328;--gold:#E3B04E;--gold-ink:#1A1205;--xp:#8FA9F2;--danger:#E5806E;--hp:#E86A5C;--mag:#B697F0;--n-c1:#3A3320;--n-c2:#22342A;--n-c3:#1E2E3A;--n-c4:#3A2526;--n-c5:#2D2740;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);color-scheme:dark}
body[data-th="dungeon"]{--bg:#15131A;--surface:#1F1C26;--surface-2:#2A2633;--ink:#E6E1EE;--muted:#9C95AA;--line:#352F40;--accent:#B497F0;--accent-ink:#17121F;--accent-soft:#2E2640;--gold:#E3B04E;--gold-ink:#1A1205;--xp:#8FA9F2;--danger:#E5806E;--hp:#E86A5C;--mag:#B697F0;--n-c1:#3A3220;--n-c2:#233228;--n-c3:#1F2B3A;--n-c4:#3A2430;--n-c5:#31264A;--shadow:0 1px 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.3);color-scheme:dark}
body[data-th="retro"]{--bg:#0E1210;--surface:#141B16;--surface-2:#1B241D;--ink:#C9F5D2;--muted:#6FA37C;--line:#24402C;--accent:#5BE07A;--accent-ink:#071109;--accent-soft:#183622;--gold:#F2D45C;--gold-ink:#1A1505;--xp:#5BC8E0;--danger:#FF7A6A;--hp:#FF6A5C;--mag:#C08CFF;--n-c1:#2A2A12;--n-c2:#12301B;--n-c3:#102A30;--n-c4:#301616;--n-c5:#241A33;--shadow:0 0 0 1px rgba(91,224,122,.08);color-scheme:dark}
body[data-th="gold"]{--bg:#0F0D0A;--surface:#1A1712;--surface-2:#26211A;--ink:#F2E8D5;--muted:#A8997E;--line:#3A3226;--accent:#E2B04E;--accent-ink:#1A1205;--accent-soft:#3A2F1A;--gold:#F2C76A;--gold-ink:#1A1205;--xp:#E07A4F;--danger:#E5806E;--hp:#E86A5C;--mag:#C79BF0;--n-c1:#3A3018;--n-c2:#2A2A16;--n-c3:#2E2216;--n-c4:#3A1E18;--n-c5:#2C2236;--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);color-scheme:dark}
body[data-th="dark"],body[data-th="dungeon"],body[data-th="retro"],body[data-th="gold"]{--de:#79CC98;--dm:#8FA9F2;--dh:#E6A35E;--dp:#D38BEA}
body[data-th="light"],body[data-th="forest"],body[data-th="sunset"]{--de:#3E8E5E;--dm:#3F63C8;--dh:#B5651D;--dp:#9B3FB8}
body[data-th="retro"] .h2,body[data-th="retro"] .label,body[data-th="retro"] .card h3{font-family:var(--f-pixel);font-size:11px;line-height:1.7;letter-spacing:0;text-transform:none}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,var(--sa-left,0px));padding-right:max(16px,var(--sa-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--sa-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:760px;margin:0 auto;padding-bottom:110px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* top bar */
.top{position:sticky;top:var(--sa-top,0px);z-index:5;background:var(--bg);padding-block:12px 6px}
.top-row{display:flex;gap:8px;align-items:center}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px;height:44px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;color:var(--ink);height:100%}
.search input::placeholder{color:var(--muted)}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;flex:none}
.seg button{border:0;background:transparent;border-radius:999px;padding:0 14px;height:38px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button[data-mode="rpg"][aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}

/* chips / groups */
.chips{display:flex;gap:8px;margin:6px 0 14px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:14px;color:var(--muted);-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent;color:var(--ink);font-weight:600}
.chip.add{border-style:dashed;width:36px;padding:0;display:grid;place-items:center}
.chip.add svg{width:16px;height:16px}
.chip-input{flex:none;border:1px solid var(--accent);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;outline:none;width:150px}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 2px 8px}
.view-head{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.view-head .h2{flex:1}

/* notes grid */
.grid{column-count:2;column-gap:12px}
@media (max-width:300px){.grid{column-count:1}}
.card{break-inside:avoid;margin:0 0 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:box-shadow .15s,transform .2s;display:block;width:100%;text-align:left;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.card:hover{box-shadow:var(--shadow)}
.card.pressing{transform:scale(.97)}
.card h3{margin:0 0 6px;font-size:15.5px;font-weight:600;line-height:1.3;text-wrap:balance;overflow-wrap:anywhere}
.card .body{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:9;-webkit-box-orient:vertical;overflow:hidden}
.mini{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.mini li{display:flex;gap:8px;align-items:flex-start;overflow-wrap:anywhere}
.mini li.done{color:var(--muted);text-decoration:line-through}
.box{width:16px;height:16px;flex:none;border:1.5px solid var(--muted);border-radius:4px;margin-top:3px;display:grid;place-items:center}
.box svg{width:12px;height:12px;stroke:var(--muted);stroke-width:3;fill:none}
.more{margin:6px 0 0;color:var(--muted);font-size:13px}
.card-foot{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.card-foot:empty{display:none}
.tag{font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.mini-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:13px}
.mini-btn:hover{border-color:var(--muted)}
.nc-c1{background:var(--n-c1);border-color:transparent}.nc-c2{background:var(--n-c2);border-color:transparent}
.nc-c3{background:var(--n-c3);border-color:transparent}.nc-c4{background:var(--n-c4);border-color:transparent}
.nc-c5{background:var(--n-c5);border-color:transparent}
.nc-c1 .tag,.nc-c2 .tag,.nc-c3 .tag,.nc-c4 .tag,.nc-c5 .tag{background:rgba(127,127,127,.16)}
.qcard{cursor:default}
.qc-top{display:flex;gap:10px;align-items:flex-start}
.qc-top h3{margin:2px 0 0;flex:1;min-width:0}
.empty{text-align:center;color:var(--muted);padding:48px 16px}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.hint{font-size:12.5px;color:var(--muted);margin:2px 2px 12px}

/* FAB */
.fab{position:fixed;right:calc(20px + var(--sa-right,0px));bottom:calc(24px + var(--sa-bottom,0px));width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:6}
.fab svg{width:26px;height:26px}
body.rpg .fab{bottom:calc(88px + var(--sa-bottom,0px))}

/* bottom nav */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:var(--sa-bottom,0px);padding-left:max(16px,var(--sa-left,0px));padding-right:max(16px,var(--sa-right,0px))}
.bottom-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.bottom button{border:0;background:transparent;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:12.5px;font-weight:600}
.bottom button span.pill{display:grid;place-items:center;width:56px;height:30px;border-radius:999px}
.bottom button[aria-selected="true"]{color:var(--ink)}
.bottom button[aria-selected="true"] span.pill{background:var(--accent-soft)}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,14,11,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;
  padding:var(--sa-top,0px) var(--sa-right,0px) 0 var(--sa-left,0px)}
@media (min-width:640px){.scrim{align-items:center;padding:24px}}
.sheet{width:100%;max-width:620px;max-height:92%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 18px calc(14px + var(--sa-bottom,0px));display:flex;flex-direction:column;gap:10px}
@media (min-width:640px){.sheet{border-radius:18px;padding-bottom:14px}}
.sheet.nc-c1{background:var(--n-c1)}.sheet.nc-c2{background:var(--n-c2)}.sheet.nc-c3{background:var(--n-c3)}.sheet.nc-c4{background:var(--n-c4)}.sheet.nc-c5{background:var(--n-c5)}
.sheet.small{max-width:440px}
.ed-title{border:0;background:transparent;outline:none;font-size:20px;font-weight:600;padding:4px 0;width:100%}
.ed-body{border:0;background:transparent;outline:none;resize:none;min-height:160px;width:100%;line-height:1.5}
.ed-title::placeholder,.ed-body::placeholder,.li-row input::placeholder{color:var(--muted)}
.li-list{display:grid;gap:2px}
.li-row{display:flex;align-items:center;gap:8px;min-height:40px}
.li-row input[type="text"]{flex:1;min-width:0;border:0;background:transparent;outline:none;padding:6px 0;border-bottom:1px solid transparent}
.li-row input[type="text"]:focus{border-bottom-color:var(--line)}
.li-row.done input[type="text"]{text-decoration:line-through;color:var(--muted)}
.li-check{width:22px;height:22px;accent-color:var(--accent);flex:none}
.li-q{border:0;background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;padding:4px 8px;border-radius:8px;display:flex;align-items:center;gap:4px;flex:none}
.li-q:hover{background:rgba(127,127,127,.14);color:var(--ink)}
.li-q svg{width:15px;height:15px}
@media (max-width:480px){.li-q-t{display:none}.li-row{gap:4px}}
.add-li{border:0;background:transparent;color:var(--muted);text-align:left;padding:8px 0;display:flex;gap:8px;align-items:center}
.ed-cat{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.ed-cat select{border:1px solid rgba(127,127,127,.35);background:transparent;border-radius:8px;padding:5px 8px;font-size:14px;color:var(--ink);max-width:100%}
.ed-cat select option{background:var(--surface);color:var(--ink)}
.ed-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid rgba(127,127,127,.25);padding-top:10px}
.ed-tools .spacer{flex:1}
.dots{display:flex;gap:6px}
.dot{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);padding:0}
.dot[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.dot.d0{background:var(--surface)}.dot.d1{background:var(--n-c1)}.dot.d2{background:var(--n-c2)}.dot.d3{background:var(--n-c3)}.dot.d4{background:var(--n-c4)}.dot.d5{background:var(--n-c5)}
.tool{border:0;background:transparent;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.tool:hover,.tool[aria-pressed="true"]{background:rgba(127,127,127,.16);color:var(--ink)}
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.seg-sm{display:flex;background:rgba(127,127,127,.14);border-radius:10px;padding:3px}
.seg-sm button{border:0;background:transparent;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.seg-sm button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}

/* confirm dialog */
.dscrim{position:fixed;inset:0;z-index:40;background:rgba(10,14,11,.5);display:grid;place-items:center;padding:24px max(16px,var(--sa-right,0px)) 24px max(16px,var(--sa-left,0px))}
.dlg{background:var(--surface);border-radius:18px;padding:20px;max-width:380px;width:100%;display:grid;gap:10px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.dlg h3{margin:0;font-size:18px;text-wrap:balance}
.dlg p{margin:0;color:var(--muted)}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}

/* menu */
.menu{position:fixed;z-index:21;top:calc(64px + var(--sa-top,0px));right:max(16px,var(--sa-right,0px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:240px;max-width:calc(100vw - 32px)}
.menu button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:8px}
.menu button:hover{background:var(--surface-2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu .danger{color:var(--danger)}
.menu p{margin:4px 12px 8px;color:var(--muted);font-size:12.5px}

/* snackbar */
.snack{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + var(--sa-bottom,0px));z-index:45;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 16px;display:flex;gap:14px;align-items:center;max-width:calc(100vw - 32px);width:max-content;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:14px}
.snack button{border:0;background:transparent;color:var(--accent-soft);font-weight:700;flex:none}

/* RPG shared */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sb{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:inherit;background:var(--xp);transition:width .3s}
.num{font-variant-numeric:tabular-nums}
.h2{font-size:17px;font-weight:600;margin:0}
.lvl{font-family:var(--f-pixel);font-size:14px}

/* arena */
.stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;background:#141018;user-select:none;-webkit-user-select:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:8px 12px 18px;color:#F3EEDF;font-size:12px;pointer-events:none;background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.35) 70%,transparent)}
.hud .tg{font-family:var(--f-pixel);font-size:8px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud .tg.boss{color:#FFD34D;opacity:1}
.hud .side{width:46%;min-width:0;display:grid;gap:4px}
.hud .side.r{text-align:right}
.hud .nm{font-weight:600;text-shadow:0 1px 0 #000;font-size:13px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:break-word;min-height:1.2em}
.hpb{height:9px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);border-radius:3px;overflow:hidden}
.hpb i{display:block;height:100%;background:#E2493B}
.hpb.hero i{background:#5BC27A}
.hud .hpt{font-size:9px;font-family:var(--f-pixel);opacity:.85}
.floats{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fl{position:absolute;font-family:var(--f-pixel);font-size:clamp(9px,2.2vw,13px);color:#FFF;text-shadow:1px 1px 0 #000,-1px 1px 0 #000;transform:translate(-50%,0);animation:fl .9s ease-out forwards;white-space:nowrap}
.fl.crit{color:#FFD24A;font-size:clamp(11px,2.8vw,16px)}
.fl.heal{color:#7CE59A}.fl.skill{color:#C9A6FF}.fl.miss{color:#B9C3CC}.fl.hit{color:#FF8A7A}
@keyframes fl{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-26px)}}
.ff{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#FFE7A6;border-radius:8px;padding:6px 10px;font-size:9px;font-family:var(--f-pixel);white-space:nowrap;pointer-events:none}
.enrage{position:absolute;right:12px;bottom:10px;background:#A3231A;color:#fff;font-family:var(--f-pixel);font-size:8px;padding:5px 7px;border-radius:6px;pointer-events:none}
.dead{position:absolute;inset:0;background:rgba(20,6,6,.6);display:grid;place-items:center;text-align:center;color:#FFE6E0;pointer-events:none;padding:0 12px}
.dead b{display:block;font-family:var(--f-pixel);font-size:clamp(12px,3vw,18px);font-weight:400;margin-bottom:10px;color:#FF8F7F}
.gacha-btn{width:100%;padding:14px 16px;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--gold);color:var(--gold-ink);border-radius:12px}
.gacha-btn .cnt{font-family:var(--f-pixel);font-size:11px;background:rgba(0,0,0,.18);padding:5px 8px;border-radius:7px}
.gacha-btn svg{width:22px;height:22px}

/* quests */
.q-form{display:grid;gap:10px}
.q-form .inp{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;outline:none;width:100%;min-width:0}
.q-form .inp:focus{border-color:var(--accent)}
.diff{display:flex;flex-wrap:wrap;gap:6px}
.diff button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.diff button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.reward-prev{font-size:13px;color:var(--muted)}
.q-list{display:grid;gap:8px}
.q{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.q.done{opacity:.65}
.q.done .q-t{text-decoration:line-through}
.q-check{width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);background:transparent;flex:none;display:grid;place-items:center;margin-top:1px}
.q-check:hover{border-color:var(--accent);background:var(--accent-soft)}
.q-check svg{width:14px;height:14px;stroke:var(--accent-ink);stroke-width:3;fill:none}
.q.done .q-check{background:var(--accent);border-color:var(--accent)}
.q-main{flex:1;min-width:0}
.q-t{font-weight:500;overflow-wrap:anywhere}
.q-m{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:4px;font-size:12.5px;color:var(--muted);align-items:center}
.dchip{font-weight:600;font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid currentColor}
.d-easy{color:var(--de)}.d-medium{color:var(--dm)}.d-hard{color:var(--dh)}.d-epic{color:var(--dp)}
.q-del{border:0;background:transparent;color:var(--muted);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.q-del:hover{background:var(--surface-2);color:var(--ink)}
.q-del svg{width:16px;height:16px}
.series-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.series{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;align-content:start}
.series h4{margin:0;font-size:15.5px}
.series .bar > i{background:var(--accent)}
details.done-list summary{cursor:pointer;color:var(--muted);font-size:14px;padding:6px 2px;list-style:none}
details.done-list summary::-webkit-details-marker{display:none}

.qtabs{display:flex;background:var(--surface-2);border-radius:12px;padding:3px}
.qtabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:9px 10px;font-weight:600;font-size:14px;color:var(--muted)}
.qtabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.sph-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:380px){.sph-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sph-tile{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 12px 12px;display:grid;gap:8px;align-content:start;cursor:pointer;min-width:0;transition:box-shadow .15s,transform .15s}
.sph-tile:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.sph-tile .nm{font-size:15px;font-weight:600;line-height:1.2;overflow-wrap:break-word;hyphens:auto}
.sph-tile .sub{font-size:12px;color:var(--muted);line-height:1.35}
.sph-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;background:var(--sc);flex:none}
.sph-ic svg{width:24px;height:24px}
.sph-ic.sm{width:34px;height:34px;border-radius:10px}.sph-ic.sm svg{width:19px;height:19px}
.sph-ic.xs{width:26px;height:26px;border-radius:8px}.sph-ic.xs svg{width:16px;height:16px}
.fav{position:absolute;top:6px;right:6px;border:0;background:transparent;width:34px;height:34px;border-radius:50%;color:var(--muted);display:grid;place-items:center}
.fav:hover{background:var(--surface-2)}
.fav svg{width:18px;height:18px}
.fav[aria-pressed="true"]{color:var(--gold)}
.fav[aria-pressed="true"] svg{fill:currentColor}
.crumbs{display:flex;align-items:center;gap:8px;margin-left:-8px}
.crumb{border:0;background:transparent;color:var(--muted);font-size:15px;padding:4px 2px}
.crumb:hover{color:var(--ink);text-decoration:underline}
.crumbs + .chips{margin:0}
.ser-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.ser-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ser-tile{position:relative;text-align:left;border:1px solid var(--line);border-top:3px solid var(--sc);background:var(--surface);border-radius:12px;padding:10px 12px 12px;display:grid;gap:6px;align-content:start;min-width:0}
.ser-tile:hover{box-shadow:var(--shadow)}
.ser-tile.locked{opacity:.62}
.ser-tile.done{background:linear-gradient(var(--accent-soft),var(--accent-soft)) top/100% 0 no-repeat,var(--surface)}
.ser-tile .nm{font-size:14.5px;font-weight:600;line-height:1.25;overflow-wrap:break-word;hyphens:auto}
.ser-tile .meta{font-size:12px;color:var(--muted)}
.ser-tile .rw{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--ink)}
.ser-tile .rw .stars{color:var(--rc);font-size:10px;letter-spacing:1px}
.ser-tile .bar > i{background:var(--sc)}
.ser-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.ser-st{font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:3px}
.ser-st svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.5;fill:none}
.ser-st.done{color:var(--de)}
.lvl-chip{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid currentColor}
.lv-0{color:var(--de)}.lv-1{color:var(--dm)}.lv-2{color:var(--dp)}
.run-list{display:grid;gap:8px}
.run{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;width:100%}
.run:hover{box-shadow:var(--shadow)}
.run-main{flex:1;min-width:0;display:grid;gap:6px}
.run-t{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ser-head{display:flex;gap:12px;align-items:center}
.ser-h{margin:2px 0 0;font-size:19px;text-wrap:balance}
.reward-box{border:1px solid var(--line);border-left:4px solid var(--rc);border-radius:10px;padding:10px 12px;display:grid;gap:4px}
.reward-box .stars{color:var(--rc);font-size:13px;letter-spacing:1px}
.ser-q{margin:0;padding-left:24px;display:grid;gap:6px;font-size:14px}
.ser-q li.done{color:var(--muted);text-decoration:line-through}
.ser-q li.cur{font-weight:600}
.ser-q li.cur::marker{color:var(--sc)}

.test-tile{position:relative;text-align:left;border:1.5px dashed var(--sc);background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(127,127,127,.06) 10px 20px),var(--surface-2);border-radius:16px;padding:10px 12px 12px;display:grid;gap:6px;align-content:start;min-width:0;overflow:hidden}
.test-tile:hover{box-shadow:var(--shadow)}
.test-tile .nm{font-size:14.5px;font-weight:600;line-height:1.25;overflow-wrap:break-word;hyphens:auto;position:relative}
.test-tile .meta{font-size:12px;color:var(--muted);position:relative}
.test-q{position:absolute;right:8px;bottom:-14px;font-family:var(--f-pixel);font-size:64px;line-height:1;color:var(--sc);opacity:.14;pointer-events:none}
.test-badge{font-family:var(--f-pixel);font-size:8px;letter-spacing:.04em;padding:4px 7px;border-radius:6px;background:var(--sc);color:#fff;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.quiz .test-badge{align-self:flex-start}
.qz-dots{display:flex;gap:6px}
.qz-dots i{flex:1;height:5px;border-radius:3px;background:var(--surface-2)}
.qz-dots i.past{background:var(--sc);opacity:.5}.qz-dots i.now{background:var(--sc)}
.qz-q{margin:4px 0 0;font-size:18px;line-height:1.35;text-wrap:balance}
.qz-opts{display:grid;gap:8px}
.qz-opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:15px}
.qz-opt:hover:not(:disabled){border-color:var(--sc)}
.qz-opt:disabled{cursor:default}
.qz-opt.ok{border-color:var(--de);background:color-mix(in srgb,var(--de) 14%,var(--surface))}
.qz-opt.bad{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,var(--surface))}
.qz-exp{margin:0;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.qz-exp.ok b{color:var(--de)}.qz-exp.bad b{color:var(--danger)}
.qz-score{display:flex;align-items:baseline;justify-content:center;gap:6px;font-family:var(--f-pixel);margin-top:8px}
.qz-score .num{font-size:44px}.qz-score .of{font-size:16px;color:var(--muted)}
.qz-score.ok .num{color:var(--de)}.qz-score.bad .num{color:var(--danger)}

/* hero */
.hero-head{display:flex;gap:14px;align-items:center}
.hero-head canvas{width:72px;height:72px;image-rendering:pixelated;background:var(--surface-2);border-radius:12px;flex:none}
.stats{display:grid;gap:2px}
.stat{display:grid;grid-template-columns:28px 1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:0}
.stat .sym{font-family:var(--f-pixel);font-size:9px;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff}
.sym.hp{background:var(--hp)}.sym.atk{background:#B5651D}.sym.mag{background:var(--mag)}
.stat .v{font-family:var(--f-pixel);font-size:12px}
.plus{border:1px solid var(--line);background:var(--surface);width:32px;height:32px;border-radius:8px;font-weight:700}
.plus:disabled{opacity:.3;cursor:default}
.gold{color:var(--gold);font-weight:600}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px;background:var(--surface)}
.item b{font-weight:600}
.sk-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:380px){.sk-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sk-tile{position:relative;border:1px solid var(--line);border-left:4px solid var(--rc);border-radius:10px;padding:8px 10px 10px;background:var(--surface);text-align:left;display:grid;gap:4px;align-content:start;min-width:0}
.sk-tile:hover{box-shadow:var(--shadow)}
.sk-tile .stars{color:var(--rc);font-size:11px;letter-spacing:1px;line-height:1}
.sk-tile .nm{font-size:13px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto;padding-right:14px}
.sk-tile .lv{position:absolute;top:7px;right:8px;font-family:var(--f-pixel);font-size:8px;color:var(--muted)}
.sk-tile .ty{font-size:11px;color:var(--muted)}
.r3{--rc:var(--r3)}.r4{--rc:var(--r4)}.r5{--rc:var(--r5)}.r6{--rc:var(--r6)}
.sk-tile.r6{border-left:4px solid #FF6FA8;background:linear-gradient(90deg,rgba(255,111,168,.12),transparent 60%),var(--surface)}
.st-rb .s1{color:#FF5E5E}.st-rb .s2{color:#F2B640}.st-rb .s3{color:#4CC86A}.st-rb .s4{color:#4A9EF0}.st-rb .s5{color:#B070F5}.st-rb .s6{color:#FF6FA8}
.sk-detail{display:grid;gap:8px}
.sk-detail .stars{font-size:20px;color:var(--rc);letter-spacing:2px}
.sk-detail h3{margin:0;font-size:20px}
.theme-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.th-tile{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);text-align:left;display:grid;gap:8px;min-width:0}
.th-tile[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.th-tile:disabled{opacity:.55;cursor:default}
.th-sw{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid rgba(127,127,127,.25)}
.th-sw span{flex:1}
.th-tile .t{font-weight:600;font-size:14px;display:flex;justify-content:space-between;gap:6px;align-items:center;flex-wrap:wrap}
.th-tile .lock{font-size:11.5px;color:var(--muted);font-weight:500;display:flex;gap:4px;align-items:center}
.th-tile .lock svg{width:13px;height:13px}

/* gacha — собственная тёмная сцена в любой теме */
.gacha{position:fixed;inset:0;z-index:50;overflow:hidden;color:#F6F1FF;background:radial-gradient(120% 90% at 50% 45%,#2A1F3D 0%,#120E1B 55%,#07060B 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:var(--sa-top,0px) max(16px,var(--sa-right,0px)) var(--sa-bottom,0px) max(16px,var(--sa-left,0px));font-family:var(--f-body);animation:gIn .3s ease-out}
@keyframes gIn{from{opacity:0}to{opacity:1}}
.gacha.quake{animation:quake .5s linear}
@keyframes quake{0%,100%{transform:none}10%{transform:translate(-8px,4px)}20%{transform:translate(7px,-6px)}30%{transform:translate(-6px,-3px)}40%{transform:translate(6px,5px)}50%{transform:translate(-4px,2px)}60%{transform:translate(4px,-3px)}70%{transform:translate(-2px,2px)}80%{transform:translate(2px,-1px)}}
.g-parts{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.g-rays{position:absolute;left:50%;top:44%;width:170vmax;height:170vmax;transform:translate(-50%,-50%);opacity:0;transition:opacity .5s;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,var(--rc) 0 5deg,transparent 5deg 15deg);
  -webkit-mask-image:radial-gradient(circle,#000 0,rgba(0,0,0,.6) 12%,transparent 38%);mask-image:radial-gradient(circle,#000 0,rgba(0,0,0,.6) 12%,transparent 38%)}

const SKILL_POOL=Object.keys(SKILLS).filter(k=>!SKILLS[k].unique);

  {id:'tapok',name:'Тапок правосудия',val:3,price:40,note:'+3 к атаке'},

function skillVal(d,lvl){return Math.round(d.val*(1+.25*(lvl-1))*100)/100}
function xpNeed(L){return Math.round(50*Math.pow(L,1.5))}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function heroStats(h){
  const L=h.lvl,it=h.items||{};
  let maxHp=100+20*(L-1)+15*h.pHp+25*(it.kruzhka||0);
  let atk=10+2*(L-1)+3*h.pAtk+3*(it.tapok||0);
  let mag=5+(L-1)+3*h.pMag+3*(it.polovnik||0);

    if(d.type==='passive')p[d.eff]+=v;else actives.push({id:s.id,eff:d.eff,val:v,cd:d.cd,name:d.name});}
  maxHp=Math.round(maxHp*(1+p.hp_pct/100));atk=Math.round(atk*(1+p.atk_pct/100)*10)/10;mag=Math.round(mag*(1+p.mag_pct/100)*10)/10;
  p.crit=Math.min(60,p.crit);p.dodge=Math.min(50,p.dodge);p.lifesteal=Math.min(40,p.lifesteal);
  return{maxHp,atk,mag,p,actives};
}
const MON={slime:'Слизень',goblin:'Гоблин',kobold:'Кобольд',skeleton:'Скелет',lich:'Лич',orc:'Орк',troll:'Тролль',vampire:'Вампир',dragon:'Дракон'};
const PUNS={slime:['Слизняшка','Слизнекот'],goblin:['Гоблен','Гоблинчик-пончик'],kobold:['Кобольдышка','Кобольдозер'],skeleton:['Скелетон-шоу','Костяныч'],lich:['Личенька','Личный кабинет'],orc:['Огрызок','Оркестр'],troll:['Троллейбус','Троллинг'],vampire:['Вампирожок','Вампиратка'],dragon:['Драконфетка','Драконоплатёжник']};
const JOKE_H=['-бухгалтер','-стажёр','-кассир','-тимлид','-блогер','-веган','-сантехник','-курьер'];
const JOKE_P=['в тапках','без пропуска','после дедлайна','из комментариев','на удалёнке','с ипотекой','на самокате','без кофе','на больничном','из соседнего подъезда','в отпуске','с понедельника'];
function tierOf(n){return n<10?0:n<20?1:n<30?2:n<40?3:4}
const TIER_TYPES=[['slime','goblin'],['kobold','skeleton'],['orc','troll'],['vampire','lich'],['dragon']];
function enemyFor(n){
  const r=mulberry32(n*2654435761>>>0),boss=n%10===0,types=TIER_TYPES[tierOf(n)];
  const type=types[Math.floor(r()*types.length)];
  let name;const roll=r();
  if(roll<.25){const p=PUNS[type];name=p[Math.floor(r()*p.length)]}
  else if(roll<.6){name=MON[type]+JOKE_H[Math.floor(r()*JOKE_H.length)]}
  else{name=MON[type]+' '+JOKE_P[Math.floor(r()*JOKE_P.length)]}
  return{n,type,boss,name,maxHp:Math.round(40*Math.pow(1.095,n)*(boss?1.6:1)),atk:Math.round(5*Math.pow(1.07,n)*(boss?1.15:1)*10)/10};
}
function newFight(n,hs){
  const e=enemyFor(n),cd={};for(const a of hs.actives)cd[a.id]=a.cd*.5;
  return{n,e,eHp:e.maxHp,hs,hp:hs.maxHp,t:0,nextH:1,nextE:1.2,cd,shield:0,stun:0,petT:2,enr:1,rng:mulberry32(n*9973+17)};
}
function stepFight(f,dt,fx){
  const hs=f.hs;f.t+=dt;
  f.enr=f.t>30?1+.15*(Math.floor((f.t-30)/5)+1):1;
  if(hs.p.regen)f.hp=Math.min(hs.maxHp,f.hp+hs.maxHp*hs.p.regen/100*dt);
  if(hs.p.pet){f.petT-=dt;if(f.petT<=0){f.petT+=2;const d=hs.mag*hs.p.pet;f.eHp-=d;fx&&fx('enemy','skill',d,'Питомец')}}
  for(const a of hs.actives){
    f.cd[a.id]-=dt;
    if(f.cd[a.id]<=0){f.cd[a.id]+=a.cd;
      if(a.eff==='fireball'){const d=hs.mag*a.val;f.eHp-=d;fx&&fx('enemy','skill',d,a.name)}
      else if(a.eff==='heal'){const h=hs.mag*a.val;f.hp=Math.min(hs.maxHp,f.hp+h);fx&&fx('hero','heal',h,a.name)}
      else if(a.eff==='shield'){f.shield+=hs.mag*a.val;fx&&fx('hero','shield',hs.mag*a.val,a.name)}
      else if(a.eff==='stun'){const d=hs.mag*a.val;f.eHp-=d;f.stun=2;fx&&fx('enemy','skill',d,a.name)}
    }
  }
  if(f.t>=f.nextH){f.nextH+=1;let d=hs.atk*(.9+f.rng()*.2);const crit=f.rng()*100<hs.p.crit;if(crit)d*=2;
    f.eHp-=d;if(hs.p.lifesteal)f.hp=Math.min(hs.maxHp,f.hp+d*hs.p.lifesteal/100);fx&&fx('enemy',crit?'crit':'dmg',d)}
  if(f.eHp<=0)return'win';
  if(f.stun>0){f.stun-=dt;f.nextE+=dt}
  else if(f.t>=f.nextE){f.nextE+=1.2;const dodge=f.rng()*100<hs.p.dodge;const v=.9+f.rng()*.2;
    if(dodge){fx&&fx('hero','miss',0)}
    else{let d=f.e.atk*f.enr*v;if(f.shield>0){const a=Math.min(f.shield,d);f.shield-=a;d-=a}f.hp-=d;fx&&fx('hero','hit',d)}}
  if(f.hp<=0||f.t>120)return'lose';
  return null;
}
function simulate(n,hs){const f=newFight(n,hs);let r=null;while(!r)r=stepFight(f,.05,null);return{res:r,t:f.t}}
/*END ENGINE*/

function catName(id){const c=S.cats.find(c=>c.id===id);return c?c.name:''}

  let inner='';
  if(n.title)inner+=`<h3>${esc(n.title)}</h3>`;
  if(n.type==='list'){

    if(ord.length>6)inner+=`<p class="more">ещё ${ord.length-6}</p>`;
  }else if(n.body)inner+=`<p class="body">${esc(shortText(n.body,30))}</p>`;
  if(!n.title&&!n.body&&!n.items.some(i=>i.text.trim()))inner+='<p class="body muted">Пустая заметка</p>';

function rewardText(d){const r=DIFF[d];return`+${r.xp} опыта · +${r.gold} золота · +${r.spins} ${plural(r.spins,'крутка','крутки','круток')}`}
function grantSkill(id){
  const h=S.hero,s=h.skills.find(x=>x.id===id);
  if(s){s.lvl++;return`${SKILLS[id].name} → ур. ${s.lvl}`}
  h.skills.push({id,lvl:1});return`Новый навык: ${SKILLS[id].name}`;
}
function addXp(xp){
  const h=S.hero,msgs=[];h.xp+=xp;
  while(h.xp>=xpNeed(h.lvl)){h.xp-=xpNeed(h.lvl);h.lvl++;h.pts+=3;h.spins+=3;msgs.push(`Уровень ${h.lvl}! +3 очка, +3 крутки`);
    for(const t of THEMES)if(t.lvl===h.lvl)msgs.push(`Открыта тема «${t.name}»`)}
  return msgs;
}
function completeQuest(id){
  const q=S.quests.find(x=>x.id===id);if(!q||q.done)return;
  q.done=true;q.doneAt=Date.now();
  const r=DIFF[q.diff],gold=Math.round(r.gold*(1+heroStats(S.hero).p.gold_pct/100)),msgs=[`+${r.xp} опыта`,`+${gold} золота`,`+${r.spins} ${plural(r.spins,'крутка','крутки','круток')}`];
  S.hero.gold+=gold;S.hero.spins+=r.spins;
  msgs.push(...addXp(r.xp));
  if(q.series){
    const sd=SERIES.find(s=>s.id===q.series),st=S.series[q.series];
    st.step++;
    if(st.step<sd.quests.length)S.quests.push({id:uid(),title:sd.quests[st.step],diff:sd.diff,done:false,created:Date.now(),series:sd.id,step:st.step});
    else{st.done=true;msgs.push('Серия пройдена! '+grantSkill(sd.skill))}
  }
  save();snack(msgs.join(' · '),'',null,4800);render();
}
function sphereOf(id){return SPHERES.find(s=>s.id===id)}
function seriesState(sd){
  const st=S.series[sd.id];
  if(st&&st.done)return'done';

  if(sd.req&&!(S.series[sd.req]&&S.series[sd.req].done))return'locked';
  return'open';

function activeSeriesCount(){return Object.values(S.series).filter(x=>!x.done).length}
function takeSeries(id){
  const sd=SERIES.find(s=>s.id===id);if(!sd||S.series[id])return;
  if(seriesState(sd)==='locked'){snack('Сначала пройдите «'+SERIES.find(s=>s.id===sd.req).name+'»');return}
  if(activeSeriesCount()>=MAX_ACTIVE){snack(`Одновременно можно вести ${MAX_ACTIVE} серии. Закончите одну из них.`);return}
  S.series[id]={step:0,done:false};
  S.quests.push({id:uid(),title:sd.quests[0],diff:sd.diff,done:false,created:Date.now(),series:id,step:0});

function finishTest(){

function restartSeries(id){

const spriteCache=new Map();
function sprite(rows,cols,flip,white){
  const key=rows.join('|')+JSON.stringify(cols)+flip+white;
  if(spriteCache.has(key))return spriteCache.get(key);
  const c=document.createElement('canvas');c.width=rows[0].length;c.height=rows.length;const x=c.getContext('2d');
  rows.forEach((r,y)=>{for(let i=0;i<r.length;i++){const ch=r[i];if(ch==='.'||!cols[ch])continue;x.fillStyle=white?'#FFFFFF':cols[ch];x.fillRect(flip?r.length-1-i:i,y,1,1)}});
  spriteCache.set(key,c);return c;
}

const A={on:false,raf:0,fight:null,phase:'run',speed:1,ffMult:1,deadT:0,last:0,hl:0,el:0,hf:0,ef:0,el$:null,time:0,deathN:0};
function startRun(){
  const hs=heroStats(S.hero);let T=0,rec=S.dungeon.record;
  for(let n=1;n<rec;n++){const r=simulate(n,hs);if(r.res!=='win'){rec=n;break}T+=r.t}
  S.dungeon.record=rec;save();
  A.ffMult=Math.max(1,T/7);A.speed=rec>1?A.ffMult:1;A.fight=newFight(1,hs);A.phase='run';
}
function fx(target,kind,val,label){
  if(target==='enemy'&&(kind==='dmg'||kind==='crit')){A.hl=.15;A.ef=.12}
  if(target==='hero'&&kind==='hit'){A.el=.15;A.hf=.12}
  if(target==='enemy'&&kind==='skill')A.ef=.12;
  if(A.speed>2.5||!A.el$)return;
  const x=target==='hero'?24:73,y=target==='hero'?60:56;

  else if(kind==='hit'){txt='-'+fmt(val);cls='hit'}
  else if(kind==='heal'){txt='+'+fmt(val);cls='heal'}
  else if(kind==='shield'){txt='Щит';cls='heal'}
  else if(kind==='miss'){txt='Мимо';cls='miss'}
  else{txt=(label&&label.length<14?label:'Навык')+' '+fmt(val);cls='skill'}
  const s=document.createElement('span');s.className='fl '+cls;s.textContent=txt;
  s.style.left=(x+(Math.random()*8-4))+'%';s.style.top=(y-(kind==='skill'?9:0))+'%';

}

function skipFF(){if(A.phase!=='run'||A.speed<=1)return;A.fight=newFight(S.dungeon.record,heroStats(S.hero));A.speed=1}
function loop(now){
  if(!A.on)return;
  const rdt=Math.min(.05,(now-A.last)/1000);A.last=now;A.time+=rdt;
  if(A.phase==='dead'){A.deadT-=rdt;if(A.deadT<=0)startRun()}
  else{
    let gdt=rdt*A.speed;
    while(gdt>0&&A.phase==='run'){
      const s=Math.min(.05,gdt);gdt-=s;
      const res=stepFight(A.fight,s,fx);
      if(res==='win'){
        const f=A.fight;
        if(f.n>=S.dungeon.record){S.dungeon.record=f.n+1;save()}
        const nn=f.n+1;A.fight=newFight(nn,heroStats(S.hero));
        if(nn>=S.dungeon.record)A.speed=1;
        break;
      }else if(res==='lose'){A.phase='dead';A.deadT=2.2;A.deathN=A.fight.n;break}
    }
  }
  const k=Math.min(1,rdt*Math.max(1,Math.min(A.speed,3)));

  draw();
  A.raf=requestAnimationFrame(loop);
}
function draw(){

  const bob=Math.sin(A.time*5)>0?0:1,dead=A.phase==='dead';
  x.globalAlpha=dead?.35:1;

  if(A.hf>0&&!dead){x.globalAlpha=.75;x.drawImage(sprite(HERO,HERO_COL,false,true),18,GROUND-12+bob)}
  x.globalAlpha=1;

  if(e.boss){x.fillStyle='#FFD34D';const cx=Math.round(ex+sz/2);x.fillRect(cx-3,Math.round(ey)-3,7,2);x.fillRect(cx-3,Math.round(ey)-5,1,2);x.fillRect(cx,Math.round(ey)-5,1,2);x.fillRect(cx+3,Math.round(ey)-5,1,2)}
  if(f.stun>0){x.fillStyle='#FFE45C';const cx=Math.round(ex+sz/2);for(let i=0;i<3;i++){const a=A.time*6+i*2.1;x.fillRect(Math.round(cx+Math.cos(a)*5),Math.round(ey-2+Math.sin(a)*1.5),1,1)}}
  if(f.shield>0&&!dead){x.strokeStyle='rgba(157,199,242,.7)';x.lineWidth=1;x.beginPath();x.arc(24,GROUND-6,9,0,Math.PI*2);x.stroke()}
  const hs=f.hs;

  if(E.eName.textContent!==e.name){E.eName.textContent=e.name;E.eTag.textContent=`№ ${f.n}${e.boss?' · БОСС':''}`;E.eTag.classList.toggle('boss',e.boss)}

}

  $('#gStage').onclick=gSkip;
}
function chestCenter(){const g=G.el.getBoundingClientRect(),c=$('#gChest').getBoundingClientRect();return{x:(c.left-g.left+c.width/2)*G.dpr,y:(c.top-g.top+c.height*.45)*G.dpr,w:c.width*G.dpr}}
function burst(stars,n,power){
  if(RM.matches||!G.el)return;const c=chestCenter();
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=(2+Math.random()*power)*G.dpr;
    G.parts.push({x:c.x+(Math.random()-.5)*c.w*.5,y:c.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3*G.dpr,g:.12*G.dpr,life:1,decay:.008+Math.random()*.012,s:2+Math.random()*4,c:stars===6?RAINBOW[i%RAINBOW.length]:(Math.random()<.25?'#FFFFFF':RAR[stars].c)})}
}
function sparks(stars){
  if(RM.matches||!G.el)return;const c=chestCenter();
  for(let i=0;i<3;i++)G.parts.push({x:c.x+(Math.random()-.5)*c.w*.7,y:c.y,vx:(Math.random()-.5)*1.2*G.dpr,vy:-(1+Math.random()*2.5)*G.dpr,g:.02*G.dpr,life:1,decay:.02+Math.random()*.02,s:1.5+Math.random()*2.5,c:stars===6?RAINBOW[Math.floor(Math.random()*6)]:RAR[stars].c});
}
function drawChest(open,stars){
  const cv=$('#gChestCv');if(!cv)return;const x=cv.getContext('2d');x.clearRect(0,0,16,12);
  x.drawImage(sprite(open?CH_O:CH_C,Object.assign({},CH_COL,{Y:stars===6?'#FFFFFF':RAR[stars].c}),false,false),0,0);
}
function setRarity(stars){G.el.style.setProperty('--rc',RAR[stars].c);$('#gRays').classList.toggle('r6',stars===6)}
function cardHtml(r,mini,i){
  const d=SKILLS[r.id];
  if(mini)return`<div class="g-mini r${r.stars}" style="--d:${(i*.09).toFixed(2)}s"><div class="g-in"><div class="g-back">?</div><div class="g-front">${starsHtml(r.stars,'g-stars')}<div class="g-name">${esc(d.name)}</div><span class="g-tag">${r.isNew?'НОВЫЙ':'УР. '+r.lvl}</span></div></div></div>`;
  return`<div class="g-card r${r.stars}"><div class="g-in"><div class="g-back">?</div><div class="g-front">
    <div class="g-stars ${r.stars===6?'st-rb':''}">${Array.from({length:r.stars},(_,k)=>`<span class="st s${k+1}" style="--i:${k}">★</span>`).join('')}</div>
    <div class="g-rname">${RAR[r.stars].name.toUpperCase()}</div>
    <div class="g-name">${esc(d.name)}</div>
    <span class="g-tag">${r.isNew?'НОВЫЙ НАВЫК':'УЛУЧШЕН ДО УР. '+r.lvl}</span>
    <div class="g-type">${d.type==='active'?'Активный':'Пассивный'}</div>
    <div class="g-desc">${esc(cap(d.desc(skillVal(d,r.lvl))))}</div></div></div></div>`;
}
async function runGacha(res){
  G.busy=true;G.skip=RM.matches;G.res=res;
  if(!G.el)openGachaShell();
  else{
    $('#gRes').innerHTML='';const ch=$('#gChest');ch.className='g-chest';ch.style.animation='none';void ch.offsetWidth;ch.style.animation='';
    $('#gRays').classList.remove('on');$('#gGlow').className='g-glow';$('#gHint').hidden=false;
  }
  $('#gUi').innerHTML='<button class="g-btn" id="gSkipBtn">Пропустить</button>';$('#gSkipBtn').onclick=gSkip;
  const best=Math.max(...res.map(r=>r.stars));
  const tease=best>=5?(Math.random()<.5?3:4):best;
  setRarity(tease);drawChest(false,tease);
  const chest=$('#gChest'),glow=$('#gGlow');
  await gWait(520);
  chest.classList.add('shake');glow.classList.add('on');
  G.sparkT=setInterval(()=>sparks(tease),60);
  await gWait(900);
  clearInterval(G.sparkT);
  if(best!==tease){
    setRarity(best);chest.classList.remove('shake');chest.classList.add('shake2');burst(best,24,3);
    G.sparkT=setInterval(()=>sparks(best),40);
    await gWait(850);clearInterval(G.sparkT);
  }else{chest.classList.remove('shake');chest.classList.add('shake2');await gWait(350)}
  setRarity(best);chest.classList.remove('shake','shake2');glow.classList.remove('on');drawChest(true,best);
  $('#gRays').classList.add('on');
  if(!G.skip){const f=$('#gFlash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
    burst(best,best>=5?140:80,best>=5?9:6);
    if(best===6){G.el.classList.remove('quake');void G.el.offsetWidth;G.el.classList.add('quake');setTimeout(()=>burst(6,120,11),250)}}
  await gWait(380);
  chest.classList.add('away');$('#gHint').hidden=true;
  const box=$('#gRes');
  box.innerHTML=res.length===1?cardHtml(res[0],false,0):`<div class="g-grid">${res.map((r,i)=>cardHtml(r,true,i)).join('')}</div>`;
  if(G.skip)box.firstElementChild.classList.add('instant');
  await gWait(res.length===1?1100+res[0].stars*150:1400);
  G.busy=false;G.skip=false;
  const sp=S.hero.spins,left=30-(S.hero.pity||0);
  $('#gUi').innerHTML=`<button class="g-btn main" id="gOne" ${sp>=1?'':'disabled'}>Ещё раз</button>
    <button class="g-btn" id="gTen" ${sp>=10?'':'disabled'}>Крутить ×10</button>
    <button class="g-btn" id="gDone">Готово</button>
    <div class="g-sub">${sp?`Круток осталось: ${sp}`:'Крутки закончились. Новые дают квесты и уровни.'} · гарантированная 5★ через ${left}</div>`;
  $('#gOne').onclick=()=>pull(1);$('#gTen').onclick=()=>pull(10);$('#gDone').onclick=closeGacha;$('#gDone').focus();
}
function closeGacha(){
  if(!G.el)return;cancelAnimationFrame(G.praf);clearInterval(G.sparkT);window.removeEventListener('resize',G.fit);
  G.el.remove();G.el=null;G.busy=false;G.skip=false;render();
}

/* ---------- long press ---------- */
const LP={t:0,x:0,y:0,fired:false,el:null};
function lpCancel(){clearTimeout(LP.t);if(LP.el)LP.el.classList.remove('pressing');LP.el=null}
document.addEventListener('pointerdown',e=>{
  const c=e.target.closest('[data-lp]');if(!c||e.button>0||e.target.closest('[data-done],.mini-btn'))return;
  LP.el=c;LP.x=e.clientX;LP.y=e.clientY;LP.fired=false;clearTimeout(LP.t);c.classList.add('pressing');
  LP.t=setTimeout(()=>{LP.fired=true;c.classList.remove('pressing');try{navigator.vibrate&&navigator.vibrate(18)}catch(_){}onLongPress(c.dataset.lp);LP.el=null},520);
});
document.addEventListener('pointermove',e=>{if(LP.el&&Math.hypot(e.clientX-LP.x,e.clientY-LP.y)>10)lpCancel()});
document.addEventListener('pointerup',lpCancel);document.addEventListener('pointercancel',lpCancel);
document.addEventListener('contextmenu',e=>{const c=e.target.closest('[data-lp]');if(!c)return;e.preventDefault();
  if(!LP.fired&&$('#dialog').hidden){lpCancel();onLongPress(c.dataset.lp)}});
document.addEventListener('click',e=>{if(LP.fired){LP.fired=false;e.stopPropagation();e.preventDefault()}},true);
function onLongPress(key){
  if(!$('#dialog').hidden)return;
  const [kind,id]=key.split(':');
  if(kind==='note'){const n=S.notes.find(x=>x.id===id);if(!n)return;
    ask({title:'Вы точно хотите удалить заметку?',text:`${n.title?`«${n.title}» `:'Она '}будет лежать в «Удалённых» 7 дней, потом исчезнет.`,ok:'Удалить',danger:true,fn:()=>trashNote(n)})}
  else if(kind==='quest'){const q=S.quests.find(x=>x.id===id);if(!q)return;
    if(q.series){snack('Квест из серии нельзя удалить');return}
    ask({title:'Удалить квест?',text:`«${q.title}» исчезнет без награды.`,ok:'Удалить',danger:true,fn:()=>{S.quests=S.quests.filter(x=>x!==q);save();render();snack('Квест удалён','Вернуть',()=>{S.quests.push(q);save();render()})}})}
  else if(kind==='cat'){const c=S.cats.find(x=>x.id===id);if(!c)return;
    ask({title:`Удалить группу «${c.name}»?`,text:'Заметки из неё останутся во «Все» без группы.',ok:'Удалить',danger:true,fn:()=>{S.cats=S.cats.filter(x=>x!==c);for(const n of S.notes)if(n.cat===id)n.cat='';if(S.noteView===id)S.noteView='all';save();render();snack('Группа удалена')}})}
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-open],[data-sphere]');if(!t)return;
  if(t.closest('#scrim,#dialog,#gacha,#menu,#snack'))return;
  const d=t.dataset;
  if(d.mode){S.mode=d.mode;query='';$('#q').value='';save();render();return}
  if(d.tab){S.tab=d.tab;save();render();return}
  if(d.view){S.noteView=d.view;save();render();return}
  if(t.id==='addCat'){catAdding=true;render();return}
  if(t.id==='menuBtn'){toggleMenu();return}
  if(t.id==='gachaBtn'){pull(1);return}
  if(d.act==='restore'){const n=S.notes.find(x=>x.id===d.id);n.trashed=false;touch(n);render();snack('Заметка восстановлена');return}
  if(d.act==='purge'){ask({title:'Удалить навсегда?',text:'Эту заметку уже нельзя будет вернуть.',ok:'Удалить',danger:true,fn:()=>{S.notes=S.notes.filter(x=>x.id!==d.id);save();render();snack('Заметка удалена навсегда')}});return}
  if(d.open){openEditor(d.open);return}
  if(d.diff){setDiff(d.diff);return}
  if(d.done){completeQuest(d.done);return}
  if(d.delq){const q=S.quests.find(x=>x.id===d.delq);S.quests=S.quests.filter(x=>x!==q);save();render();snack('Квест удалён','Вернуть',()=>{S.quests.push(q);save();render()});return}
  if(d.qtab){S.qTab=d.qtab;save();render();return}
  if(d.fav){const f=S.favSpheres=S.favSpheres||[];const i=f.indexOf(d.fav);if(i>=0)f.splice(i,1);else f.push(d.fav);save();render();return}
  if(d.sphere){S.catSphere=d.sphere;catDir='all';save();render();window.scrollTo(0,0);return}
  if(d.catback!==undefined){S.catSphere=null;save();render();return}
  if(d.dir){catDir=d.dir;render();return}
  if(d.ser){openSeriesSheet(d.ser);return}
  if(d.test){startTest(d.test);return}
  if(d.skill){openSkillSheet(d.skill);return}
  if(d.pt){if(S.hero.pts>0){S.hero.pts--;S.hero[d.pt]++;save();render()}return}
  if(t.id==='autoPts'){const k=['pHp','pAtk','pMag'];let i=0;while(S.hero.pts>0){S.hero[k[i%3]]++;S.hero.pts--;i++}save();render();return}
  if(d.buy){const it=SHOP.find(x=>x.id===d.buy),h=S.hero;h.items=h.items||{};const c=h.items[it.id]||0,price=Math.round(it.price*Math.pow(1.5,c));
    if(h.gold>=price){h.gold-=price;h.items[it.id]=c+1;save();render();snack(`Куплено: ${it.name}`)}return}
});
function setDiff(k){qDiff=k;for(const b of document.querySelectorAll('#qDiff button'))b.setAttribute('aria-pressed',String(b.dataset.diff===qDiff));const p=$('#qPrev');if(p)p.textContent='Награда: '+rewardText(qDiff)}
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.card[data-open]')){e.preventDefault();openEditor(e.target.dataset.open);return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.sph-tile')){e.preventDefault();S.catSphere=e.target.dataset.sphere;catDir='all';save();render();return}
  if(e.key==='Escape'){
    if(G.el){if(G.busy)gSkip();else closeGacha();return}
    if(!$('#dialog').hidden){$('#dialog').hidden=true;return}
    if(!$('#scrim').hidden){closeSheet();return}
    if(!$('#menu').hidden)$('#menu').hidden=true;
  }
});
$('#fab').onclick=()=>{
  if(S.mode==='notes'){if(S.noteView==='quests')openQuestSheet();else newNote();return}
  if(S.qTab==='catalog'){S.qTab='mine';save();render()}
  const i=$('#qTitle');if(i){i.focus();i.scrollIntoView({block:'center',behavior:'smooth'})}
};
$('#q').addEventListener('input',e=>{query=e.target.value.trim();if(S.mode==='rpg'&&S.tab==='arena'){S.tab='quests';save()}render()});
document.addEventListener('submit',e=>{
  if(e.target.id!=='qForm')return;e.preventDefault();
  const v=$('#qTitle').value.trim();if(!v){$('#qTitle').focus();return}
  S.quests.push({id:uid(),title:v,diff:qDiff,done:false,created:Date.now()});save();
  if(sheetKind==='quest')closeSheet();
  render();snack('Квест добавлен');
  if(S.mode==='rpg')setTimeout(()=>{const i=$('#qTitle');i&&i.focus()},0);
});

/* sheet events */
const scrim=$('#scrim');
scrim.addEventListener('click',e=>{
  if(e.target===scrim){closeSheet();return}
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.close!==undefined){closeSheet();return}
  if(d.diff){setDiff(d.diff);return}
  if(d.take){closeSheet();takeSeries(d.take);return}
  if(d.restart){closeSheet();restartSeries(d.restart);return}
  if(d.pick!==undefined&&QZ.picked===null){QZ.picked=+d.pick;if(QZ.picked===0)QZ.score++;drawQuiz();return}
  if(d.next!==undefined){QZ.i++;QZ.picked=null;drawQuiz();return}
  if(d.retest){startTest(d.retest);return}
  if(d.themeId){S.theme=d.themeId;save();applyTheme();for(const x of scrim.querySelectorAll('.th-tile'))x.setAttribute('aria-pressed',String(x.dataset.themeId===S.theme));return}
  if(sheetKind!=='note')return;
  const n=curNote();if(!n)return;
  if(d.type&&d.type!==n.type){
    if(d.type==='list'){const lines=n.body.split('\n').map(s=>s.trim()).filter(Boolean);n.items=(lines.length?lines:['']).map(t=>({id:uid(),text:t,done:false}));n.body=''}
    else{n.body=n.items.map(i=>i.text).filter(Boolean).join('\n');n.items=[]}
    n.type=d.type;touch(n);drawEditor();return}
  if(d.color!==undefined){n.color=d.color;touch(n);drawEditor();return}
  if(d.ed==='pin'){n.pinned=!n.pinned;touch(n);drawEditor();return}
  if(d.ed==='archive'){n.archived=!n.archived;if(n.archived)n.pinned=false;touch(n);const wasArch=n.archived;closeEditor();
    snack(wasArch?'Заметка в архиве':'Заметка возвращена','Отменить',()=>{n.archived=!wasArch;save();render()});return}
  if(d.ed==='trash'){
    if(noteEmpty(n)){S.notes=S.notes.filter(x=>x!==n);edNew=false;closeEditor();return}
    ask({title:'Вы точно хотите удалить заметку?',text:'Она будет лежать в «Удалённых» 7 дней, потом исчезнет.',ok:'Удалить',danger:true,fn:()=>{edNew=false;closeEditor();trashNote(n)}});return}
  if(d.ed==='close'){closeEditor();return}
  if(b.id==='addLi'){const it={id:uid(),text:'',done:false};n.items.push(it);touch(n);drawEditor();setTimeout(()=>$('#lt-'+it.id)?.focus(),0);return}
  if(d.rmli){n.items=n.items.filter(i=>i.id!==d.rmli);touch(n);drawEditor();return}
  if(d.toquest){const it=n.items.find(i=>i.id===d.toquest);if(!it||!it.text.trim()){snack('Сначала напишите текст пункта');return}
    S.quests.push({id:uid(),title:it.text.trim(),diff:'easy',done:false,created:Date.now()});save();
    snack('Квест создан: «'+it.text.trim()+'»','К квестам',()=>{closeEditor();S.noteView='quests';save();render()});return}
});
scrim.addEventListener('input',e=>{
  if(sheetKind!=='note')return;const n=curNote();if(!n)return;const el=e.target;
  if(el.id==='ed-title')n.title=el.value;
  else if(el.id==='ed-body')n.body=el.value;
  else if(el.id&&el.id.startsWith('lt-')){const it=n.items.find(i=>'lt-'+i.id===el.id);if(it)it.text=el.value}
  else return;
  touch(n);
});
scrim.addEventListener('change',e=>{
  if(sheetKind!=='note')return;const n=curNote();if(!n)return;const el=e.target;
  if(el.id==='ed-cat'){n.cat=el.value;touch(n);return}
  if(el.id&&el.id.startsWith('lc-')){const it=n.items.find(i=>'lc-'+i.id===el.id);if(it){it.done=el.checked;el.closest('.li-row').classList.toggle('done',it.done);touch(n)}}
});
scrim.addEventListener('keydown',e=>{
  const el=e.target;if(sheetKind==='note'&&e.key==='Enter'&&el.id&&el.id.startsWith('lt-')){e.preventDefault();const n=curNote();const idx=n.items.findIndex(i=>'lt-'+i.id===el.id);
    const it={id:uid(),text:'',done:false};n.items.splice(idx+1,0,it);touch(n);drawEditor();setTimeout(()=>$('#lt-'+it.id)?.focus(),0)}
});

/* menu */
function toggleMenu(){
  const m=$('#menu');if(!m.hidden){m.hidden=true;return}
  const th=THEMES.find(t=>t.id===(S.theme||'system'));
  const arch=S.notes.filter(n=>n.archived&&!n.trashed).length,tr=S.notes.filter(n=>n.trashed).length;
  m.innerHTML=`<button id="mTheme">Тема: ${esc(th?th.name:'Системная')}</button>
    <button id="mArch">Архив${arch?` · ${arch}`:''}</button>
    <button id="mTrash">Удалённые${tr?` · ${tr}`:''}</button><hr>
    <button id="mHide">${S.rpgHidden?'Показать вкладку РПГ':'Скрыть вкладку РПГ'}</button>
    <p>${S.rpgHidden?'Сейчас приложение работает как обычный блокнот.':'Без РПГ приложение остаётся обычными заметками.'}</p>
    <button id="mReset" class="danger">Сбросить прогресс РПГ</button>
    <p>Данные хранятся только в этом браузере.</p>`;
  m.hidden=false;
  $('#mTheme').onclick=()=>{m.hidden=true;openThemeSheet()};
  $('#mArch').onclick=()=>{m.hidden=true;S.mode='notes';S.noteView='archive';save();render()};
  $('#mTrash').onclick=()=>{m.hidden=true;S.mode='notes';S.noteView='trash';save();render()};
  $('#mHide').onclick=()=>{S.rpgHidden=!S.rpgHidden;m.hidden=true;save();render()};
  $('#mReset').onclick=()=>{m.hidden=true;
    ask({title:'Сбросить прогресс РПГ?',text:'Уровень, навыки, золото и серии начнутся заново. Заметки и свои квесты останутся.',ok:'Сбросить',danger:true,fn:()=>{
      S.hero=freshHero();S.dungeon={record:1};S.series={};S.quests=S.quests.filter(q=>!q.series);A.fight=null;
      if((THEMES.find(t=>t.id===S.theme)||{lvl:1}).lvl>1)S.theme='system';save();render();snack('Прогресс РПГ сброшен')}})};
}
document.addEventListener('pointerdown',e=>{const m=$('#menu');if(!m.hidden&&!m.contains(e.target)&&!e.target.closest('#menuBtn'))m.hidden=true});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopArena();else if(S.mode==='rpg'&&S.tab==='arena'&&!G.el)render()});

purgeOld();render();
</script>
